<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FrameDreaming web product cover</title>
  <desc id="desc">A dark ocean-blue product interface with the words Make ideas move and a cinematic preview frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041f2c"/>
      <stop offset=".52" stop-color="#0c5364"/>
      <stop offset="1" stop-color="#4b9f9b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#78c8c1" stop-opacity=".15"/>
      <stop offset="1" stop-color="#f0c58c" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e1bf"/>
      <stop offset=".45" stop-color="#d59671"/>
      <stop offset="1" stop-color="#153f50"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1370" cy="40" rx="430" ry="320" fill="#9de0d7" opacity=".18" filter="url(#blur)"/>
  <ellipse cx="260" cy="880" rx="440" ry="290" fill="#062b3a" opacity=".55" filter="url(#blur)"/>

  <g fill="none" stroke="#d5efeb" stroke-opacity=".18">
    <path d="M0 760C270 650 430 860 740 730s490-90 860 40"/>
    <path d="M0 795c280-112 470 86 768-42 318-137 495-84 832 26"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif">
    <text x="84" y="92" fill="#eef8f6" font-size="25" letter-spacing="8">FRAMEDREAMING</text>
    <text x="1290" y="92" fill="#c0e3df" font-size="16" letter-spacing="3">WEB PRODUCT / 2026</text>
    <text x="92" y="425" fill="#f4fbfa" font-size="102" font-weight="500" letter-spacing="-5">Make ideas</text>
    <text x="92" y="535" fill="#bce7e1" font-size="102" font-weight="500" letter-spacing="-5">move.</text>
    <text x="96" y="603" fill="#d9eeeb" fill-opacity=".78" font-size="22" letter-spacing="1">A calm web studio for turning images and prompts</text>
    <text x="96" y="638" fill="#d9eeeb" fill-opacity=".78" font-size="22" letter-spacing="1">into short, cinematic video.</text>
  </g>

  <g transform="translate(890 210)">
    <rect width="570" height="500" rx="26" fill="#071f2b" fill-opacity=".74" stroke="#d1eeea" stroke-opacity=".32"/>
    <rect x="28" y="28" width="514" height="42" rx="12" fill="#d5e9e7" fill-opacity=".10"/>
    <circle cx="52" cy="49" r="5" fill="#9bd5d1"/>
    <text x="72" y="55" fill="#d9eeeb" font-family="Montserrat, Arial, sans-serif" font-size="14" letter-spacing="2">NEW GENERATION</text>
    <rect x="28" y="98" width="514" height="274" rx="20" fill="url(#frame)"/>
    <circle cx="414" cy="163" r="90" fill="#f6e5c6" fill-opacity=".30"/>
    <path d="M28 316c90-120 164-18 252-93 84-72 156-54 262-145v194H28Z" fill="#0b4757" fill-opacity=".72"/>
    <circle cx="285" cy="235" r="38" fill="#f4fbfa" fill-opacity=".92"/>
    <path d="m276 213 29 22-29 22z" fill="#0c5364"/>
    <rect x="28" y="400" width="310" height="12" rx="6" fill="#bce7e1" fill-opacity=".35"/>
    <rect x="28" y="432" width="206" height="9" rx="4" fill="#bce7e1" fill-opacity=".20"/>
    <rect x="390" y="398" width="152" height="48" rx="24" fill="#f2f7f5"/>
    <text x="420" y="428" fill="#0c2530" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">GENERATE</text>
  </g>

  <g transform="translate(96 820)" font-family="Montserrat, Arial, sans-serif" font-size="15" letter-spacing="1">
    <rect width="166" height="42" rx="21" fill="#eef8f6" fill-opacity=".14" stroke="#c6e9e5" stroke-opacity=".28"/>
    <text x="24" y="27" fill="#e9f7f4">IMAGE TO VIDEO</text>
    <rect x="182" width="166" height="42" rx="21" fill="#eef8f6" fill-opacity=".14" stroke="#c6e9e5" stroke-opacity=".28"/>
    <text x="206" y="27" fill="#e9f7f4">TEXT TO VIDEO</text>
  </g>
</svg>
